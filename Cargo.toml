[package]
name = "neo_ws"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
spin = "0.9"
x86_64 = "0.15"
pic8259 = "0.11"
pc-keyboard = "0.8"
linked_list_allocator = "0.10"

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
run-args = [
    "-m", "3G",
    "-smp", "4",
    "-accel", "whpx,kernel-irqchip=off",
    "-accel", "tcg,thread=multi",
    "-drive", "format=raw,file=neo_disk.img,index=1,media=disk",
    "-netdev", "user,id=net0",
    "-device", "e1000,netdev=net0",
    "-audiodev", "dsound,id=snd0",
    "-device", "ac97,audiodev=snd0",
]
